[workspace]
authors = ["orchestrate <threads@orchestrate.invalid>"]
channels = ["https://prefix.dev/nandi-testing", "conda-forge"]
name = "goose-sample"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Compile and run demo.goose in-process with the bundled TinyCC backend.
demo = "goose demo.goose"
# A request/iteration-scoped loop: per-request scratch plus a bounded ring.
iteration = "goose iteration.goose"
# A fixed-cadence loop: stack scratch, bounded outbox, explicit backpressure.
realtime = "goose realtime.goose"
# Realtime stem-aware audio visualizer: live capture, FFT, four lanes, ANSI.
viz = "goose --stack-reserve 64M visualizer.goose"
# Typecheck every program.
check = "goose check demo.goose && goose check iteration.goose && goose check realtime.goose && goose check visualizer.goose"
# Build native executables beside the sources.
build = "goose build demo.goose && goose build iteration.goose && goose build realtime.goose && goose build --stack-reserve 64M visualizer.goose"
# Build only the visualizer's executable (its C sidecar takes a few seconds).
build-viz = "goose build --stack-reserve 64M visualizer.goose"
# Build all, then run one of the native executables.
run-native = { cmd = "./demo", depends-on = ["build"] }
run-iteration-native = { cmd = "./iteration", depends-on = ["build"] }
run-realtime-native = { cmd = "./realtime", depends-on = ["build"] }
run-viz-native = { cmd = "./visualizer", depends-on = ["build-viz"] }
# Report each loop's data-stack high-water mark.
stack-stats = "goose -DGS_STACK_STATS=1 iteration.goose"
realtime-stack-stats = "goose -DGS_STACK_STATS=1 realtime.goose"
# Offscreen render of the same framebuffer the terminal uses, for the README.
screenshot = "goose --stack-reserve 64M visualizer.goose -- --synthetic --png screenshots/visualizer.png --frames 240 --width 960 --height 540"
# Headless hot-loop measurements: JIT and native.
viz-bench = "goose --stack-reserve 64M visualizer.goose -- --synthetic --bench --frames 240 --width 960 --height 540"
viz-bench-native = { cmd = "./visualizer --synthetic --bench --frames 600 --width 960 --height 540", depends-on = ["build-viz"] }
# Report the visualizer's data-stack high-water mark after one render.
viz-stack-stats = "goose --stack-reserve 64M -DGS_STACK_STATS=1 visualizer.goose -- --synthetic --bench --frames 1"
# Report the runtime version and the C toolchain Goose found.
version = "goose version"
toolchain = "goose toolchain"

[dependencies]
goose = ">=2026.3.post100,<2027"
